name: Build NovaBroadcast

on:
  push:
    branches: [ main, "develop/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WebRTC Linux runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Build
        run: bash build.sh

      - name: Verify JAR
        run: test -s NovaBroadcast.jar

      - name: Self-test
        run: java -jar NovaBroadcast.jar --self-test

      - name: Config preflight
        run: java -jar NovaBroadcast.jar --config-check

      - name: Native WebRTC smoke test
        run: java -jar NovaBroadcast.jar --webrtc-smoke-test

      - name: Upload tested JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBroadcast-${{ github.sha }}
          path: NovaBroadcast.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct development JAR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete development-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          git tag -f development-latest "$GITHUB_SHA"
          git push origin refs/tags/development-latest --force
          gh release create development-latest NovaBroadcast.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "NovaBroadcast Development Build" \
            --notes "Tested development build from commit $GITHUB_SHA. Download NovaBroadcast.jar directly from Assets." \
            --prerelease
