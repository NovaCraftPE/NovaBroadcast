name: Build NovaBroadcast

on:
  push:
    branches: [ main, "develop/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WebRTC Linux runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0

      - name: Build
        run: bash build.sh

      - name: Verify JAR
        run: test -s NovaBroadcast.jar

      - name: Self-test
        run: java -jar NovaBroadcast.jar --self-test

      - name: Config preflight
        run: java -jar NovaBroadcast.jar --config-check

      - name: Native WebRTC smoke test
        run: java -jar NovaBroadcast.jar --webrtc-smoke-test

      - name: Upload tested JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaBroadcast-${{ github.sha }}
          path: NovaBroadcast.jar
          if-no-files-found: error
          retention-days: 14
