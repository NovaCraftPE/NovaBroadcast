name: Publish NovaBroadcast Pterodactyl Image

on:
  push:
    branches: [ "develop/**" ]
    paths:
      - "docker/Dockerfile.pterodactyl-java21"
      - ".github/workflows/pterodactyl-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: novabroadcast-pterodactyl-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.pterodactyl-java21
          push: true
          tags: |
            ghcr.io/novacraftpe/novabroadcast-java21:develop
            ghcr.io/novacraftpe/novabroadcast-java21:${{ github.sha }}
          platforms: linux/amd64
